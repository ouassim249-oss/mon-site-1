<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Photo avant à ajouter">
  <defs>
    <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="18" height="18" fill="#2b3a4c"/>
      <rect width="9" height="18" fill="#33455a"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#hatch)"/>
  <g fill="#8fa4bb" font-family="DM Sans, Segoe UI, sans-serif" text-anchor="middle">
    <text x="400" y="278" font-size="52">📷</text>
    <text x="400" y="336" font-size="30" font-weight="700" fill="#dbe6f2">Photo AVANT</text>
    <text x="400" y="372" font-size="19">à remplacer par votre propre photo</text>
  </g>
</svg>
